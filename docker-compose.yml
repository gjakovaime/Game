volumes:
  hf-cache:

services:
  game:
    build:
      context: .
    ports:
      - "8081:8081"
    volumes:
      # Mount source dirs so edits on the host appear instantly in the container.
      # After editing, run: docker compose exec game npm run build:web
      # then refresh the browser.
      - ./src:/app/src
      - ./app:/app/app
      - ./assets:/app/assets
      - ./app.json:/app/app.json
      - ./babel.config.js:/app/babel.config.js
      
    environment:
      - EXPO_OFFLINE=1

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8083:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./src:/app/src
      - ./app:/app/app
      - ./assets:/app/assets
      - ./app.json:/app/app.json
      - ./babel.config.js:/app/babel.config.js
      - ./package.json:/app/package.json
    environment:
      - EXPO_TOKEN=${EXPO_TOKEN}
      - EXPO_OFFLINE=0
    command: npx expo start --tunnel --clear
    profiles:
      - dev

  generate-audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    volumes:
      - ./assets/audio:/app/assets/audio
      - ./scripts:/app/scripts
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - audio
